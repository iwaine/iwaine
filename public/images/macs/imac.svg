<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="imacBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="imacScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="imacStand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="300" cy="480" rx="200" ry="15" fill="#000" opacity="0.2"/>
  
  <!-- Display -->
  <rect x="80" y="50" width="440" height="330" rx="25" fill="url(#imacBody)"/>
  <rect x="100" y="70" width="400" height="290" rx="15" fill="url(#imacScreen)"/>
  
  <!-- Camera -->
  <circle cx="300" cy="85" r="5" fill="#374151"/>
  
  <!-- Stand -->
  <rect x="280" y="380" width="40" height="60" rx="5" fill="url(#imacStand)"/>
  <ellipse cx="300" cy="465" rx="80" ry="15" fill="url(#imacStand)"/>
  
  <!-- Chin logo area -->
  <rect x="100" y="360" width="400" height="20" fill="url(#imacBody)" opacity="0.3"/>
</svg>
