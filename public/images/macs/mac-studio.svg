<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="studioTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="studioBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="300" cy="420" rx="200" ry="18" fill="#000" opacity="0.3"/>
  
  <!-- Body -->
  <rect x="130" y="150" width="340" height="200" rx="20" fill="url(#studioBody)"/>
  <rect x="130" y="150" width="340" height="40" rx="20" fill="url(#studioTop)"/>
  
  <!-- Ventilation slots -->
  <rect x="150" y="170" width="300" height="2" fill="#9ca3af" opacity="0.5"/>
  <rect x="150" y="180" width="300" height="2" fill="#9ca3af" opacity="0.5"/>
  
  <!-- Front ports -->
  <circle cx="180" cy="300" r="7" fill="#4b5563"/>
  <circle cx="210" cy="300" r="7" fill="#4b5563"/>
  <circle cx="240" cy="300" r="7" fill="#4b5563"/>
  <rect x="280" y="295" width="50" height="10" rx="5" fill="#4b5563"/>
  
  <!-- Side cooling pattern -->
  <circle cx="420" cy="250" r="3" fill="#6b7280"/>
  <circle cx="420" cy="270" r="3" fill="#6b7280"/>
  <circle cx="420" cy="290" r="3" fill="#6b7280"/>
  <circle cx="420" cy="310" r="3" fill="#6b7280"/>
</svg>
