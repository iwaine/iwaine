<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="proBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="proScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="300" cy="425" rx="260" ry="18" fill="#000" opacity="0.3"/>
  
  <!-- Base -->
  <path d="M 90 385 L 510 385 L 490 405 L 110 405 Z" fill="url(#proBody)"/>
  
  <!-- Screen -->
  <rect x="110" y="70" width="380" height="315" rx="18" fill="url(#proBody)"/>
  <rect x="125" y="85" width="350" height="285" rx="8" fill="url(#proScreen)"/>
  
  <!-- Notch -->
  <rect x="280" y="85" width="40" height="15" rx="7" fill="#000"/>
  
  <!-- XDR display glow -->
  <rect x="125" y="85" width="350" height="285" rx="8" fill="radial-gradient(circle, rgba(147,51,234,0.05) 0%, transparent 70%)"/>
  
  <!-- Keyboard -->
  <path d="M 90 385 L 110 365 L 490 365 L 510 385 Z" fill="#1a1a1a"/>
  
  <!-- Trackpad -->
  <rect x="250" y="370" width="100" height="10" rx="5" fill="#2a2a2a"/>
</svg>
