<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg-gradient)"/>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>

    <linearGradient id="laptop-gradient-pro" x1="300" y1="180" x2="900" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="50%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <linearGradient id="screen-pro" x1="340" y1="200" x2="860" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a1a1c"/>
    </linearGradient>

    <radialGradient id="screen-glow-pro" cx="600" cy="370" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shadow-pro" cx="600" cy="660" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="600" cy="660" rx="480" ry="90" fill="url(#shadow-pro)"/>

  <!-- MacBook Base (thicker for Pro) -->
  <path d="M 270 590 L 930 590 L 910 630 L 290 630 Z" fill="url(#laptop-gradient-pro)" stroke="#000000" stroke-width="2"/>

  <!-- MacBook Screen Base -->
  <rect x="310" y="180" width="580" height="410" rx="14" fill="url(#laptop-gradient-pro)" stroke="#000000" stroke-width="3"/>

  <!-- Screen Bezel -->
  <rect x="330" y="200" width="540" height="370" rx="10" fill="#000000" stroke="#2c2c2e" stroke-width="1"/>

  <!-- Screen Display (XDR) -->
  <rect x="340" y="210" width="520" height="350" rx="6" fill="url(#screen-pro)"/>

  <!-- Screen Glow (brighter for XDR) -->
  <rect x="340" y="210" width="520" height="350" rx="6" fill="url(#screen-glow-pro)"/>

  <!-- Screen Content - macOS UI -->
  <g opacity="0.8">
    <!-- Menu bar -->
    <rect x="350" y="220" width="500" height="22" fill="#1c1c1e" opacity="0.95"/>
    <circle cx="365" cy="231" r="4" fill="#ff5f57"/>
    <circle cx="382" cy="231" r="4" fill="#febc2e"/>
    <circle cx="399" cy="231" r="4" fill="#28c840"/>

    <!-- Dock -->
    <rect x="475" y="530" width="250" height="22" rx="11" fill="#1c1c1e" opacity="0.9"/>
    <rect x="485" y="534" width="14" height="14" rx="3" fill="#0a84ff"/>
    <rect x="505" y="534" width="14" height="14" rx="3" fill="#30d158"/>
    <rect x="525" y="534" width="14" height="14" rx="3" fill="#ff9f0a"/>
    <rect x="545" y="534" width="14" height="14" rx="3" fill="#ff375f"/>
    <rect x="565" y="534" width="14" height="14" rx="3" fill="#bf5af2"/>

    <!-- Final Cut Pro Window mockup -->
    <rect x="380" y="280" width="440" height="220" rx="10" fill="#1c1c1e" opacity="0.7"/>
    <rect x="390" y="310" width="420" height="180" rx="6" fill="#0a0a0c" opacity="0.8"/>
    <!-- Timeline -->
    <rect x="400" y="450" width="400" height="30" fill="#0a84ff" opacity="0.3"/>
  </g>

  <!-- Keyboard area (with notch representation) -->
  <rect x="340" y="595" width="520" height="30" rx="4" fill="#1c1c1e" opacity="0.6"/>

  <!-- Trackpad (larger for Pro) -->
  <rect x="500" y="600" width="200" height="120" rx="6" fill="#0a0a0c" stroke="#000000" stroke-width="1" opacity="0.8"/>

  <!-- Apple Logo (glowing) -->
  <g transform="translate(590, 360)">
    <path d="M 10 -18 Q 18 -18 18 -10 Q 18 0 12 6 Q 18 12 12 18 Q 0 18 -6 12 Q -12 18 -18 12 Q -12 6 -12 -6 Q -12 -18 0 -18 Q 6 -12 10 -18 Z"
          fill="#ffffff" opacity="0.15"filter="blur(2px)"/>
  </g>

  <!-- Product name -->
  <text x="600" y="720" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="36" font-weight="700" fill="#f5f5f7" text-anchor="middle">
    MacBook Pro
  </text>
  <text x="600" y="760" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="20" font-weight="500" fill="#86868b" text-anchor="middle">
    Supercharged for pros.
  </text>
</svg>