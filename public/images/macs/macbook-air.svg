<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="airBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1e47;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="airScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="airGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="300" cy="420" rx="250" ry="20" fill="#000" opacity="0.2"/>
  
  <!-- Base/Bottom -->
  <path d="M 100 380 L 500 380 L 480 400 L 120 400 Z" fill="url(#airBody)"/>
  <path d="M 100 380 L 500 380 L 480 400 L 120 400 Z" fill="url(#airGlow)"/>
  
  <!-- Screen/Lid -->
  <rect x="120" y="80" width="360" height="300" rx="15" fill="url(#airBody)"/>
  <rect x="135" y="95" width="330" height="265" rx="5" fill="url(#airScreen)"/>
  
  <!-- Apple logo hint -->
  <circle cx="300" cy="227" r="30" fill="#374151" opacity="0.3"/>
  
  <!-- Keyboard base -->
  <path d="M 100 380 L 120 360 L 480 360 L 500 380 Z" fill="#0f172a"/>
  
  <!-- Notch -->
  <rect x="285" y="95" width="30" height="10" rx="5" fill="#000"/>
  
  <!-- Keyboard dots -->
  <circle cx="300" cy="370" r="2" fill="#4b5563"/>
  
  <!-- Light reflection on screen -->
  <rect x="135" y="95" width="330" height="80" rx="5" fill="url(#airGlow)" opacity="0.1"/>
</svg>
