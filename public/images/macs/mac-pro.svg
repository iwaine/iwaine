<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="proGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4B5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#F9FAFB"/>
  <rect x="80" y="50" width="240" height="180" rx="20" fill="url(#proGradient)"/>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="2" fill="#6B7280"/>
  </pattern>
  <rect x="90" y="60" width="220" height="160" fill="url(#grid)"/>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937" text-anchor="middle">Mac Pro</text>
</svg>
